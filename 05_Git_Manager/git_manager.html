<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Git Manager</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #2f81f7;
    --accent-hover: #388bfd;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --purple: #a371f7;
    --orange: #f0883e;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Layout ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .branch-badge {
    background: #21262d;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .remote-label {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  .refresh-btn {
    background: #21262d;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: #30363d; }

  main {
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto auto;
    gap: 1px;
    background: var(--border);
    height: calc(100vh - 53px);
  }

  .panel {
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .panel-body {
    overflow-y: auto;
    flex: 1;
    padding: 12px;
  }

  /* ── Files panel (left) ── */
  #files-panel { grid-row: 1 / 3; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 8px 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title:first-child { margin-top: 0; }

  .count-badge {
    background: var(--border);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10px;
    color: var(--text);
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }
  .file-item:hover { background: #161b22; }
  .file-item.selected { background: #1f2937; }

  .file-checkbox {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  .file-status {
    font-size: 10px;
    font-weight: 700;
    width: 14px;
    text-align: center;
    flex-shrink: 0;
  }
  .file-status.M { color: var(--yellow); }
  .file-status.A { color: var(--green); }
  .file-status.D { color: var(--red); }
  .file-status.R { color: var(--purple); }
  .file-status.U { color: var(--orange); }
  .file-status.q { color: var(--muted); }

  .file-path {
    flex: 1;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: "SF Mono", "Fira Code", monospace;
  }

  .file-action {
    font-size: 10px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.1s;
    cursor: pointer;
  }
  .file-item:hover .file-action { opacity: 1; }
  .file-action:hover { color: var(--accent); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  /* ── Commit box ── */
  #commit-box {
    border-top: 1px solid var(--border);
    padding: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }

  #commit-msg {
    width: 100%;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    resize: vertical;
    min-height: 60px;
    outline: none;
    transition: border-color 0.15s;
  }
  #commit-msg:focus { border-color: var(--accent); }
  #commit-msg::placeholder { color: var(--muted); }

  .push-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    align-items: center;
  }

  #stage-all-btn {
    background: #21262d;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  #stage-all-btn:hover { background: #30363d; }

  #push-btn {
    flex: 1;
    background: var(--accent);
    border: none;
    color: #fff;
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  #push-btn:hover { background: var(--accent-hover); }
  #push-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status-msg {
    margin-top: 8px;
    font-size: 12px;
    min-height: 16px;
    transition: color 0.2s;
  }
  .status-msg.ok { color: var(--green); }
  .status-msg.err { color: var(--red); }
  .status-msg.info { color: var(--muted); }

  /* ── Tabs (right side) ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .tab-btn {
    padding: 10px 18px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-pane { display: none; height: 100%; }
  .tab-pane.active { display: flex; flex-direction: column; height: 100%; }

  /* ── Diff viewer ── */
  #diff-output {
    flex: 1;
    overflow: auto;
    padding: 12px 16px;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 12px;
    white-space: pre;
    line-height: 1.6;
  }

  .diff-add { color: var(--green); background: rgba(63,185,80,0.06); }
  .diff-del { color: var(--red); background: rgba(248,81,73,0.06); }
  .diff-hunk { color: var(--purple); }
  .diff-file { color: var(--accent); font-weight: 600; }
  .diff-meta { color: var(--muted); }

  /* ── Commit log ── */
  .commit-item {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid #21262d;
    align-items: flex-start;
  }
  .commit-item:hover { background: #161b22; }

  .commit-hash {
    font-family: monospace;
    font-size: 11px;
    color: var(--accent);
    width: 52px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .commit-info { flex: 1; min-width: 0; }

  .commit-msg-text {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .commit-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── Change log ── */
  .changelog-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .changelog-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .changelog-hash {
    font-family: monospace;
    font-size: 11px;
    background: #21262d;
    padding: 2px 7px;
    border-radius: 4px;
    color: var(--accent);
  }

  .changelog-msg {
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .changelog-ts {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .changelog-files {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }

  .file-chip {
    font-size: 10px;
    background: #21262d;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: monospace;
    color: var(--muted);
    white-space: nowrap;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .changelog-stat {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-family: monospace;
    white-space: pre-wrap;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 32px 16px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* ── Right panels ── */
  #right-panel { grid-row: 1 / 3; }
  .right-inner { display: flex; flex-direction: column; height: 100%; }
  .right-content { flex: 1; overflow: hidden; }
</style>
</head>
<body>

<header>
  <h1>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f0883e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
      <path d="M6 9v6M13.9 5.1L8.1 10.9M13.9 18.9L8.1 13.1"/>
    </svg>
    Git Manager <span style="font-size:10px;color:var(--muted);font-weight:400">v1.1</span>
  </h1>
  <div class="branch-badge">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><circle cx="6" cy="18" r="3"/>
      <path d="M18 6a9 9 0 0 1-9 9"/>
    </svg>
    <span id="branch-name">loading…</span>
  </div>
  <span class="remote-label" id="remote-label"></span>
  <button class="refresh-btn" onclick="loadStatus()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    Refresh
  </button>
</header>

<main>
  <!-- Left: files + commit box -->
  <div class="panel" id="files-panel">
    <div class="panel-header">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Working Tree
    </div>
    <div class="panel-body" id="files-body">
      <div class="empty">Loading…</div>
    </div>

    <!-- Commit / push box -->
    <div id="commit-box">
      <div style="position:relative">
        <textarea id="commit-msg" placeholder="Commit message…" rows="3"></textarea>
        <button id="suggest-btn" onclick="suggestCommit()" title="Auto-generate commit message" style="
          position:absolute; top:6px; right:6px;
          background:#21262d; border:1px solid var(--border); color:var(--muted);
          border-radius:5px; padding:3px 8px; font-size:11px; cursor:pointer;
          transition: color 0.15s, background 0.15s;
        " onmouseover="this.style.color='var(--text)';this.style.background='#30363d'"
           onmouseout="this.style.color='var(--muted)';this.style.background='#21262d'">
          &#10024; Auto-fill
        </button>
      </div>
      <div class="push-row">
        <button id="stage-all-btn" onclick="stageAll()">Stage All</button>
        <button id="push-btn" onclick="commitAndPush()">Commit &amp; Push</button>
      </div>
      <div class="status-msg info" id="status-msg"></div>
    </div>
  </div>

  <!-- Right: diff / log / changelog -->
  <div class="panel" id="right-panel">
    <div class="right-inner">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('diff')">Diff</button>
        <button class="tab-btn" onclick="switchTab('gitlog')">Commit Log</button>
        <button class="tab-btn" onclick="switchTab('changelog')">Change Log</button>
      </div>

      <div class="right-content">
        <!-- Diff -->
        <div class="tab-pane active" id="tab-diff">
          <div id="diff-output" class="diff-meta">Select a file to view its diff.</div>
        </div>

        <!-- Git log -->
        <div class="tab-pane" id="tab-gitlog">
          <div id="gitlog-body" style="overflow-y:auto;height:100%;"></div>
        </div>

        <!-- Change log -->
        <div class="tab-pane" id="tab-changelog">
          <div id="changelog-body" style="overflow-y:auto;height:100%;padding:12px;"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const API = '';
let currentStatus = { staged:[], unstaged:[], untracked:[] };
let selectedFile = null;
let selectedStaged = false;

// ── Helpers ──────────────────────────────────────────────────────────────────

async function get(url) {
  const r = await fetch(API + url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function post(url, body) {
  const r = await fetch(API + url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({ detail: 'Unknown error' }));
    throw new Error(d.detail || JSON.stringify(d));
  }
  return r.json();
}

function setStatus(msg, type='info') {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

function statusColor(s) {
  const map = { modified:'M', added:'A', deleted:'D', renamed:'R', unmerged:'U', untracked:'q' };
  return map[s] || s[0].toUpperCase();
}

// ── Tab switching ─────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['diff','gitlog','changelog'][i] === name);
  });
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'gitlog') loadGitLog();
  if (name === 'changelog') loadChangeLog();
}

// ── Status / Files ────────────────────────────────────────────────────────────

async function suggestCommit() {
  const btn = document.getElementById('suggest-btn');
  const prev = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const data = await get('/api/suggest-commit');
    if (data.message) {
      document.getElementById('commit-msg').value = data.message;
    }
  } catch(e) { /* silent */ } finally {
    btn.textContent = prev;
    btn.disabled = false;
  }
}

async function loadStatus() {
  try {
    const data = await get('/api/status');
    currentStatus = data;
    document.getElementById('branch-name').textContent = data.branch || 'unknown';
    document.getElementById('remote-label').textContent = data.remote || '';
    renderFiles(data);
    setStatus('');
    // Auto-fill commit message if textarea is empty and there are changes
    const hasChanges = data.staged.length || data.unstaged.length || data.untracked.length;
    if (hasChanges && !document.getElementById('commit-msg').value.trim()) {
      suggestCommit();
    }
  } catch(e) {
    setStatus('Failed to load status: ' + e.message, 'err');
  }
}

function renderFiles(data) {
  const body = document.getElementById('files-body');
  const sections = [
    { title: 'Staged', key: 'staged', actionLabel: 'unstage', actionFn: 'unstageFile' },
    { title: 'Unstaged', key: 'unstaged', actionLabel: 'stage', actionFn: 'stageFile' },
    { title: 'Untracked', key: 'untracked', actionLabel: 'stage', actionFn: 'stageFile' },
  ];

  let html = '';
  let hasAny = false;

  for (const sec of sections) {
    const items = data[sec.key] || [];
    if (!items.length) continue;
    hasAny = true;
    html += `<div class="section-title">${sec.title} <span class="count-badge">${items.length}</span></div>`;
    for (const f of items) {
      const code = statusColor(f.status);
      const isStaged = sec.key === 'staged';
      const pathEsc = f.path.replace(/"/g, '&quot;');
      html += `
        <div class="file-item" onclick="viewDiff('${pathEsc}', ${isStaged})" data-path="${pathEsc}" data-staged="${isStaged}">
          <input type="checkbox" class="file-checkbox" data-path="${pathEsc}" data-staged="${isStaged}" onclick="event.stopPropagation()" />
          <span class="file-status ${code}">${code}</span>
          <span class="file-path" title="${pathEsc}">${f.path}</span>
          <span class="file-action" onclick="event.stopPropagation(); ${sec.actionFn}('${pathEsc}')">${sec.actionLabel}</span>
        </div>`;
    }
    html += '<hr class="divider" />';
  }

  body.innerHTML = hasAny ? html : '<div class="empty">Clean working tree.</div>';
}

// ── Stage / Unstage ───────────────────────────────────────────────────────────

async function stageFile(path) {
  try {
    await post('/api/stage', { paths: [path] });
    await loadStatus();
  } catch(e) { setStatus(e.message, 'err'); }
}

async function unstageFile(path) {
  try {
    await post('/api/unstage', { paths: [path] });
    await loadStatus();
  } catch(e) { setStatus(e.message, 'err'); }
}

async function stageAll() {
  try {
    setStatus('Staging all…', 'info');
    await post('/api/stage', { paths: [] });
    await loadStatus();
    setStatus('All changes staged.', 'ok');
  } catch(e) { setStatus(e.message, 'err'); }
}

// ── Diff ──────────────────────────────────────────────────────────────────────

async function viewDiff(path, isStaged) {
  selectedFile = path;
  selectedStaged = isStaged;
  switchTab('diff');
  const out = document.getElementById('diff-output');
  out.innerHTML = '<span style="color:var(--muted)">Loading diff…</span>';
  try {
    const data = await get(`/api/diff?path=${encodeURIComponent(path)}&staged=${isStaged}`);
    out.innerHTML = colorDiff(data.diff);
  } catch(e) {
    out.innerHTML = `<span style="color:var(--red)">${e.message}</span>`;
  }
}

function colorDiff(text) {
  return text.split('\n').map(line => {
    const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (line.startsWith('+++') || line.startsWith('---')) return `<span class="diff-file">${esc}</span>`;
    if (line.startsWith('+')) return `<span class="diff-add">${esc}</span>`;
    if (line.startsWith('-')) return `<span class="diff-del">${esc}</span>`;
    if (line.startsWith('@@')) return `<span class="diff-hunk">${esc}</span>`;
    if (line.startsWith('diff') || line.startsWith('index')) return `<span class="diff-meta">${esc}</span>`;
    return esc;
  }).join('\n');
}

// ── Commit & Push ─────────────────────────────────────────────────────────────

async function commitAndPush() {
  const msg = document.getElementById('commit-msg').value.trim();
  if (!msg) { setStatus('Enter a commit message.', 'err'); return; }

  const checked = [...document.querySelectorAll('.file-checkbox:checked')];
  const paths = checked.map(c => c.dataset.path);

  const btn = document.getElementById('push-btn');
  btn.disabled = true;
  setStatus('Committing & pushing…', 'info');

  try {
    const data = await post('/api/push', { message: msg, paths });
    document.getElementById('commit-msg').value = '';
    setStatus(`Pushed ${data.commit} → ${data.branch}`, 'ok');
    await loadStatus();
  } catch(e) {
    setStatus(e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// ── Git Log ───────────────────────────────────────────────────────────────────

async function loadGitLog() {
  const body = document.getElementById('gitlog-body');
  body.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const data = await get('/api/git-log?limit=50');
    if (!data.commits.length) { body.innerHTML = '<div class="empty">No commits yet.</div>'; return; }
    body.innerHTML = data.commits.map(c => `
      <div class="commit-item">
        <span class="commit-hash">${c.short}</span>
        <div class="commit-info">
          <div class="commit-msg-text">${escHtml(c.message)}</div>
          <div class="commit-meta">${escHtml(c.author)} · ${fmtDate(c.date)}</div>
        </div>
      </div>`).join('');
  } catch(e) {
    body.innerHTML = `<div class="empty" style="color:var(--red)">${e.message}</div>`;
  }
}

// ── Change Log ────────────────────────────────────────────────────────────────

async function loadChangeLog() {
  const body = document.getElementById('changelog-body');
  body.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const data = await get('/api/change-log');
    if (!data.entries.length) {
      body.innerHTML = '<div class="empty">No pushes recorded yet.</div>';
      return;
    }
    body.innerHTML = data.entries.map(e => `
      <div class="changelog-item">
        <div class="changelog-header">
          <span class="changelog-hash">${e.id}</span>
          <span class="changelog-msg" title="${escHtml(e.message)}">${escHtml(e.message)}</span>
          <span class="changelog-ts">${fmtDate(e.timestamp)}</span>
        </div>
        <div class="changelog-files">
          ${e.files.map(f => `<span class="file-chip" title="${escHtml(f)}">${escHtml(f)}</span>`).join('')}
        </div>
        ${e.diff_stat ? `<div class="changelog-stat">${escHtml(e.diff_stat)}</div>` : ''}
      </div>`).join('');
  } catch(e) {
    body.innerHTML = `<div class="empty" style="color:var(--red)">${e.message}</div>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────────

loadStatus();
</script>
